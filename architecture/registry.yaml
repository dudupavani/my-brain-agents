version: 1

repository:
  role: global_memory
  platform: github
  agent_runtime: hermes
  orchestrator: none
  routing_rules: architecture/routing.md

agents:
  personal_content:
    profile: "personal-content"
    platform: "Hermes"
    scope: "Assistente pessoal generalista que aciona skills conforme o pedido"
    contract:
      - agents/personal/README.md
      - agents/hermes/CONTENT.md
      - agents/hermes/HANDOFF.md
    read_paths:
      - shared/
      - domains/
      - content/
      - references/brand/
      - references/editorial/
      - .agents/skills/
    write_paths:
      - domains/personal/
      - content/
      - .agents/skills/
    capability_paths:
      - .agents/skills/instagram-carousel/
      - .agents/skills/news-to-carousel/

  products:
    profile: "Agente de produtos"
    platform: "Hermes"
    scope: "Materiais, decisões e trabalho relacionados a produtos"
    contract:
      - agents/products/README.md
    read_paths:
      - shared/
      - domains/products/
      - .agents/skills/
    write_paths:
      - domains/products/
      - .agents/skills/
    capability_paths: []

participants:
  codex:
    role: "Colaborador de produção visual do domínio Instagram"
    read_paths:
      - content/
      - .agents/skills/instagram-carousel/
    write_paths:
      - content/items/*/deliverables/

domains:
  shared:
    path: shared/
    purpose: "Informação deliberadamente útil para mais de um agente"

  personal:
    path: domains/personal/
    owner: personal_content
    purpose: "Materiais pessoais que não pertencem a um domínio especializado"

  products:
    path: domains/products/
    owner: products
    purpose: "Memória de produtos"

  instagram:
    path: content/
    owner: personal_content
    purpose: "Conteúdo e entregas produzidos pela capacidade de carrossel para Instagram"

skills:
  path: .agents/skills/
  policy: live_source
  versioning: update_in_place
