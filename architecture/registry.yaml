version: 2
status: active_v1

repository:
  role: shared_versioned_brain
  platform: github
  canonical_branch: main
  map: mapa.md
  system: architecture/system.md
  decisions: architecture/decisions.md
  routing: architecture/routing.md

runtime_model:
  agent_host: hermes_profiles
  configuration_scope: external_to_repository
  identity_source: hermes_profile
  private_memory_source: hermes_profile
  project_context: AGENTS.md
  models_are_interchangeable: true

agents:
  products:
    status: active
    purpose: "Conversar sobre, pesquisar, decidir e construir os produtos e softwares do Eduardo"
    contract: agents/products/README.md
    brain: product_brain
    read_paths:
      - architecture/
      - shared/
      - domains/products/
      - inbox/products/
      - .agents/skills/
    write_paths:
      - domains/products/
      - inbox/personal-content/

  personal-content:
    status: active
    purpose: "Criar e manter o conteúdo pessoal do Eduardo"
    contract: agents/personal-content/README.md
    brain: personal_content_brain
    read_paths:
      - architecture/
      - shared/
      - domains/products/
      - content/
      - references/
      - inbox/personal-content/
      - .agents/skills/
    write_paths:
      - content/
      - inbox/products/
    conditional_write_paths:
      - path: references/
        condition: "Regra ou decisão aprovada explicitamente pelo Eduardo"
      - path: .agents/skills/
        condition: "Procedimento recorrente, validado e autorizado para promoção compartilhada"

systems:
  extract-design:
    status: active
    purpose: "Extrair a estrutura visual de uma imagem de referência e gerar um design.json"
    canonical_path: projects/extract-design/
    input: "JPG ou PNG de referência"
    output: "design.json"
    writes_generated_content: false

  design-renderer:
    status: active
    purpose: "Renderizar posts PNG a partir de um design.json e do conteúdo informado"
    canonical_path: projects/design-renderer/
    input: "design.json e conteúdo do post"
    output: "PNG independente por geração"
    generated_content_path: generated-content/
    writes_generated_content: true

brains:
  product_brain:
    owner: products
    canonical_paths:
      - domains/products/
    inbox: inbox/products/
    shared_paths:
      - shared/

  personal_content_brain:
    owner: personal-content
    canonical_paths:
      - content/
      - references/
    inbox: inbox/personal-content/
    shared_paths:
      - shared/

maintainers:
  eduardo:
    role: owner_and_final_authority
    write_paths:
      - "**"

  codex_desktop:
    role: architecture_and_infrastructure_maintainer_on_explicit_request
    is_hermes_agent: false
    write_paths:
      - AGENTS.md
      - README.md
      - mapa.md
      - .gitignore
      - architecture/
      - agents/
      - shared/
      - inbox/
      - .agents/skills/
      - "**/AGENTS.md"
      - "**/README.md"
      - references/editorial/
      - content/templates/

external_systems:
  github:
    authority: canonical-content-and-history
  clickup:
    authority: task_tracking
    canonical_content: false
  software_repositories:
    authority: source_code

governance:
  single_owner_per_persistent_effect: true
  secrets_in_repository: false
  orchestration: deferred
  split_repository_on_permission_boundary: true
  versioned_systems_in_this_brain:
    - projects/extract-design/
    - projects/design-renderer/
